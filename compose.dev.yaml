# Local development services. Ports bind to 127.0.0.1 only.
#   npm run db:up     start (waits until healthy)
#   npm run db:down   stop (data kept in the pgdata volume)
# Passwords below are development-only defaults; production uses compose.yaml
# (Phase 7) with secrets from .env.production on the server.
name: duis-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: duis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
      DUIS_OWNER_PASSWORD: ${DUIS_OWNER_PASSWORD:-duis_owner_dev_only}
      DUIS_APP_PASSWORD: ${DUIS_APP_PASSWORD:-duis_app_dev_only}
      DUIS_READONLY_PASSWORD: ${DUIS_READONLY_PASSWORD:-duis_readonly_dev_only}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker;
      # mount the parent directory (see doc/07-deployment-operations.md).
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d duis"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    # Catches all outgoing email; web UI at http://localhost:8025
    image: axllent/mailpit:v1.32.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  redis:
    # Shared cache (ADR-0033). Same settings as production; nothing is saved
    # to disk. Database 0 is the dev server's, 15 the integration tests'.
    image: redis:8.10.2-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_only}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      # 6380 on the host: other projects on a laptop often hold 6379.
      - "127.0.0.1:6380:6379"
    environment:
      # redis-cli reads the password from here (health check, debugging).
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    # Product search (ADR-0033). Single node, security on (user "elastic"),
    # plain HTTP on localhost only. A smaller heap than production so it fits
    # a laptop's Docker VM. The index is rebuilt from Postgres at any time
    # (npm run search:reindex), so its volume holds nothing precious.
    image: elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      # Indexes are only ever created with their mappings (the indexer).
      action.auto_create_index: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-elastic_dev_only}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf -u "elastic:$$ELASTIC_PASSWORD" "localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" > /dev/null',
        ]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  pgdata:
  esdata:
