# PostgreSQL settings for the production stack (doc/07 §1: 8 vCPU / 16 GB).
# shared_buffers and effective_cache_size come from compose.yaml so a smaller
# machine (or a laptop) can override them.

listen_addresses = '*'
port = 5432
max_connections = 100
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'

# Memory
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = try

# Disk (NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200
max_parallel_workers_per_gather = 2

# Write-ahead log and checkpoints
wal_level = replica
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# Continuous archiving to the backup bucket (doc/07 §6). A WAL file is
# switched at least every 5 minutes, which bounds data loss (RPO).
archive_mode = on
archive_command = 'pgbackrest --stanza=duis archive-push %p'
archive_timeout = 300

# Logging (to stdout; Docker rotates it)
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '

# Sessions that sit idle inside a transaction hold locks; end them.
idle_in_transaction_session_timeout = 5min
