# pgBackRest (doc/07 §6). The bucket, keys and encryption passphrase come
# from PGBACKREST_* variables set in compose.yaml, never from this file.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full=4
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=off

[duis]
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
