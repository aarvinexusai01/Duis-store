# Who may connect (doc/05 §2). Postgres has no published port; the backend
# network is reachable only by the app containers.
# TYPE  DATABASE  USER                                ADDRESS     METHOD

# Unix socket: inside this container and the backup container, which shares
# the socket volume. Used for administration, backups and the initdb scripts.
local   all       all                                             trust

# TCP: the application roles only, with passwords. The superuser can't log
# in over the network at all.
host    duis      duis_app,duis_owner,duis_readonly   0.0.0.0/0   scram-sha-256
host    duis      duis_app,duis_owner,duis_readonly   ::/0        scram-sha-256
