# Settings for every request passed to the web replicas (nginx.conf).
proxy_http_version 1.1;
proxy_set_header Connection "";
# The host exactly as the browser sent it, port included: Next.js refuses a
# Server Action whose Origin doesn't match it (found by the race suite on
# a non-443 port).
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Request-Id $request_id;
# Clients can't choose these.
proxy_set_header CF-Connecting-IP "";

# Next sends large headers (preload links, cookies).
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;
proxy_read_timeout 60s;
# The replicas are on the same machine: a connection takes under a
# millisecond. A stopped replica's address simply vanishes, and with the
# default 60 s a request would hang that long before trying the other one
# (found in the outage drill on the first server).
proxy_connect_timeout 3s;

# A request that can't reach one replica is retried on the other. Only
# safe methods are retried; a POST is never sent twice.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;
