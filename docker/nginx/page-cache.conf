# The 10-second page cache (ADR-0033), for the storefront location in
# nginx.conf. A burst of visitors to one page becomes one request to the app
# every 10 seconds; anyone with a bag or signed in always reaches the app.
proxy_cache pages;
proxy_cache_key "$scheme$http_host$request_uri";
proxy_cache_valid 200 10s;
# Only GET and HEAD are cached (the default); POSTs (Server Actions) pass.
proxy_cache_bypass $page_cache_cookie_skip $page_cache_rsc_skip;
proxy_no_cache $page_cache_cookie_skip $page_cache_rsc_skip;
# Next marks these pages private/no-store; Nginx alone keeps a copy, and
# browsers get the header below (never Cloudflare: it stays "private"). A response that sets a cookie is
# never stored (Nginx's default, kept by not ignoring Set-Cookie).
proxy_ignore_headers Cache-Control Expires;
# One copy per page, whatever compression a visitor accepts; Cloudflare
# compresses for the visitor.
proxy_set_header Accept-Encoding "";
# While a page is being fetched, others asking for it wait for that copy.
proxy_cache_lock on;
proxy_cache_lock_timeout 5s;
# Serve the last copy while refreshing it, or while both replicas are down.
proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update on;

# Browsers: see $public_page_browser_cache in nginx.conf (instant Back/Forward).
proxy_hide_header Cache-Control;
add_header Cache-Control $public_page_browser_cache always;

include /etc/nginx/site/hsts.conf;
add_header X-Cache-Status $upstream_cache_status always;
