# Duis edge server (doc/07 §2 and §5): Cloudflare → Nginx → web_a / web_b.
# Runs as the unprivileged nginx user (uid 101) on a read-only filesystem.
#
# Files under /etc/nginx/site come from the server's state/nginx folder,
# written by the ops scripts, so this file never needs editing per server:
#   origin.pem, origin.key   Cloudflare Origin CA certificate (locally: self-signed)
#   cloudflare-ips.conf      set_real_ip_from lines (ops/update-cloudflare-ips.sh)
#   upstream.conf            the web replicas; deploys mark one `down` while replacing it
#   hsts.conf                the HSTS header (HSTS_MAX_AGE in .env.infra)
# Apply changes with `nginx -s reload`, which never drops connections.

worker_processes auto;
pid /tmp/nginx.pid;
# After a reload, old workers get this long to finish their requests.
worker_shutdown_timeout 30s;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    # The visitor's IP is taken from CF-Connecting-IP only when the connection
    # really comes from Cloudflare; from anywhere else the header is ignored.
    include /etc/nginx/site/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Docker's DNS, so replicas are found again after they are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    log_format json escape=json '{"time":"$time_iso8601","client_ip":"$remote_addr",'
        '"connection_ip":"$realip_remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration":$request_time,'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"request_id":"$request_id","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    include /etc/nginx/site/upstream.conf;

    # --- Caches (ADR-0033) ---------------------------------------------------
    # On the nginx_cache volume, not the in-memory /tmp. Nothing here needs
    # keeping: an empty cache only means the app answers a little more.
    #
    # Whole storefront pages, for 10 seconds, only for visitors whose page is
    # the same as everyone else's: no bag and not signed in (see page-cache.conf).
    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m
        max_size=256m inactive=10m use_temp_path=off;
    # Next's build files: their names change with their content.
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m
        max_size=512m inactive=7d use_temp_path=off;

    # The bag and sign-in cookies change what a page shows (the bag count,
    # the account menu). The cookie-banner choice doesn't: it's read in the
    # browser. Better Auth's cookies start "duis." (cookiePrefix).
    map $http_cookie $page_cache_cookie_skip {
        default 0;
        "~(^|;\s*)duis_cart=" 1;
        "~(^|;\s*)(__Secure-|__Host-)?duis\." 1;
    }
    # What browsers may do with a public page (ADR-0033). "no-cache" lets them
    # keep it for instant Back/Forward but re-ask on every normal visit, so
    # prices and stock stay live. Signed-in visitors keep Next's "no-store":
    # their pages carry their name and aren't kept on shared computers.
    map $http_cookie $public_page_browser_cache {
        default "private, no-cache";
        "~(^|;\s*)(__Secure-|__Host-)?duis\." "private, no-cache, no-store, max-age=0, must-revalidate";
    }
    # In-app navigations fetch a different response (RSC) for the same URL;
    # they go to the app, which serves them from the shared cache.
    map "$http_rsc$arg__rsc" $page_cache_rsc_skip {
        default 1;
        "" 0;
    }

    # Health check for the container itself (compose.yaml), never published.
    server {
        listen 127.0.0.1:8080;
        access_log off;
        location = /health {
            return 200 "ok\n";
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        # One site: Cloudflare only forwards the store's own host names.
        server_name _;

        ssl_certificate /etc/nginx/site/origin.pem;
        ssl_certificate_key /etc/nginx/site/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Server Actions and forms (Next keeps its own 1 MB limit on actions).
        client_max_body_size 2m;
        large_client_header_buffers 4 16k;

        # One host for search engines (Phase 11): www.<domain> is a duplicate
        # of the site, so it redirects permanently to the bare domain.
        if ($http_host ~* ^www\.(.+)$) {
            return 301 https://$1$request_uri;
        }

        # add_header in a location replaces the server's, so every location
        # with its own headers includes this file again.
        include /etc/nginx/site/hsts.conf;

        # Cache invalidation is for the worker on the internal network only.
        location ^~ /api/internal/ {
            return 404;
        }

        # Files moved to ImageKit are kept in /media/.moved and never served
        # (Phase 10): the originals there are clean and full size.
        location ^~ /media/. {
            return 404;
        }

        # Processed images are content-addressed files on the media volume.
        location ^~ /media/ {
            alias /srv/media/;
            try_files $uri =404;
            include /etc/nginx/site/hsts.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Staff media uploads (15 MB) and customer photos (8 MB).
        location = /api/media/upload {
            client_max_body_size 16m;
            proxy_pass http://duis_web;
            include /etc/nginx/duis/proxy.conf;
        }
        location = /api/photos {
            client_max_body_size 10m;
            proxy_pass http://duis_web;
            include /etc/nginx/duis/proxy.conf;
        }

        # Hashed build files (JS, CSS, fonts): kept a week at the edge.
        location ^~ /_next/static/ {
            proxy_pass http://duis_web;
            include /etc/nginx/duis/proxy.conf;
            proxy_cache static;
            proxy_cache_valid 200 7d;
            proxy_cache_lock on;
            include /etc/nginx/site/hsts.conf;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Logo, icons and the app manifest: a week in browsers. Renamed when the
        # artwork changes (scripts/make-brand-assets.mjs) if it must show sooner.
        location ^~ /brand/ {
            proxy_pass http://duis_web;
            include /etc/nginx/duis/proxy.conf;
            proxy_cache static;
            proxy_cache_valid 200 1d;
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            include /etc/nginx/site/hsts.conf;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Storefront pages that look the same for every signed-out visitor.
        # Bag, checkout, account, sign-in, admin and API never match.
        location ~ ^/(|shop(/.*)?|products/[^/]+|collections(/[^/]+)?|search|journal(/.*)?|pages/[^/]+|policies/[^/]+|about|faq|contact|size-guide)$ {
            proxy_pass http://duis_web;
            include /etc/nginx/duis/proxy.conf;
            include /etc/nginx/duis/page-cache.conf;
        }

        location / {
            proxy_pass http://duis_web;
            include /etc/nginx/duis/proxy.conf;
        }
    }
}
