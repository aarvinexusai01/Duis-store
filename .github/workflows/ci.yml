name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

# Actions are pinned to commit SHAs (supply-chain safety); Dependabot bumps them.
jobs:
  checks:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # Production dependencies only; dev-tool advisories are reviewed by hand.
      - run: npm audit --omit=dev --audit-level=high

  integration:
    name: Integration tests (PostgreSQL + Mailpit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:up
      - run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: cp .env.example .env
      - run: npm run db:up
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg APP_SHA=${GITHUB_SHA::12} -t duis-web:ci .
      - name: Start hardened container
        run: |
          docker run -d --name web -p 127.0.0.1:3000:3000 \
            --read-only --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e APP_URL=http://localhost:3000 \
            -e DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci \
            -e BETTER_AUTH_SECRET=ci-only-secret-0123456789abcdefghijklmn \
            -e SMTP_HOST=127.0.0.1 -e SMTP_PORT=1025 -e "SMTP_FROM=Duis <ci@duis.test>" \
            -e INTERNAL_REVALIDATE_SECRET=ci-only-secret-0123456789abcdefghijklmn \
            -e INTERNAL_REVALIDATE_URLS=http://127.0.0.1:3000 \
            duis-web:ci
      - name: Wait for the health check
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker logs web
          test "$status" = "healthy"
          curl -fsS http://127.0.0.1:3000/api/health

  ops:
    name: Production stack files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell scripts pass shellcheck
        run: shellcheck -x -P ops ops/*.sh ops/compose ops/local/init.sh docker/postgres/bin/duis-backup
      - name: Compose files are valid
        run: |
          ops/local/init.sh
          ops/compose config -q
          APP_SHA=ci PG_TAG=ci docker compose -p duis-drill --project-directory . \
            --env-file .env.infra -f compose.drill.yaml -f compose.drill.local.yaml config -q
      - name: Nginx configuration is valid
        run: |
          bash -c 'source ops/lib.sh && write_nginx_state'
          docker run --rm -v "$PWD/docker/nginx:/etc/nginx/duis:ro" -v "$PWD/state/nginx:/etc/nginx/site:ro" \
            nginxinc/nginx-unprivileged:1.30.5-alpine nginx -c /etc/nginx/duis/nginx.conf -t
      - name: Postgres and backup image builds
        run: docker build -t duis-postgres:ci docker/postgres
